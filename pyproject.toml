[project]
name = "pygor"
version = "1.0"
authors = [
    { name="Simen Bruøygard", email="simen.bruoygard@pm.me" },
]
description = """A package for interacting with Igor Pro,
for internal use, for Baden-lab members
"""
license = "AGPL-3.0-or-later"
readme = "README.md"
requires-python = ">=3.12"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: GNU Affero General Public License v3 or later (AGPLv3+)",
    "Operating System :: OS Independent",
]

dependencies = [
    "numpy>=2.1",
    "matplotlib",
    "h5py",
    "pandas > 2.2.0",
    "seaborn",
    "scikit-learn",
    "scikit-image>=0.25",
    "scipy",
    "dacite",
    "tifffile",
    "natsort",
    "tqdm",
    "statannotations>=0.4.4",
    "pycircstat2",
    "ipykernel>=6.29.5",
    "ipywidgets>=8.1.5",
    "pywavelets>=1.9.0",
]

[project.optional-dependencies]
gui = [
    "napari>=0.5.6",
    "pyqt5>=5.15.11",
]
cellpose = [
    "cellpose[gui]>=4.0.8",
]
notebook = [
    "ipywidgets",
    "ipykernel>=6.29.5",
    "notebook>=7.3.2",
    "jupyter>=1.1.1",
]

[project.urls]
Homepage = "https://github.com/simbru/pygor"
Issues = "https://github.com/simbru/pygor/issues"

[tool.uv]
package = true

[dependency-groups]
dev = [
    "uv>=0.4.24",
    "ruff>=0.8.0",
    "igor2>=0.5.12",
    "ipykernel>=7.2.0",
    "pytest>=8.0",
    "pytest-timeout>=2.3",
]

constraint-dependencies = ["pyqt5-qt5 <=5.15.2"]

[tool.uv.sources]
# statannotations = { git = "https://github.com/getzze/statannotations/", branch = "compat-seaborn-13" }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pyright]
typeCheckingMode = "basic"

[tool.pytest.ini_options]
testpaths = ["src/pygor/test"]
# No test should need this long. A test that does has hung, and the run should
# say so rather than sit there until someone notices.
timeout = 300
markers = [
    "demo_data: needs examples/strf_demo_data.h5, skipped when absent",
    "slow: runs for tens of seconds or more",
]
