# Pygor Package Defaults
# Pass config="filepath" to loaders to override any of these values per analysis.

[instrument]
fish_screen_dist_mm = 160.0
screen_width_mm = 300.0
screen_width_pix_au = 1820
screen_height_pix_au = 1140
screen_width_visang = 86.306
lens_to_retina_distance_um = 50.0

[preprocessing]
artifact_width = 3
flip_x = true
detrend = true
smooth_window_s = 1000.0
time_bin = 10
fix_first_frame = true

[registration]
n_reference_frames = 100
batch_size = 50
upsample_factor = 10
normalization = "None"
order = 1
mode = "reflect"
parallel = true
n_jobs = -1
batch_mode = "std"
reference_mode = "mean"
edge_crop = 1

[triggers]
threshold = 20000
min_gap_seconds = 0.05

[segmentation.general]
mode = "blob"
roi_order = "LR"

[segmentation.cellpose]
diameter = 0
flow_threshold = 0.9
cellprob_threshold = 0.5
min_size = 2

[segmentation.cellpose_postprocess]
split_large = true
size_multiplier = 1.25
min_peak_distance = 2
min_size_after_split = 4
shrink_iterations = 1
shrink_size_threshold = 30

[segmentation.blob]
input_mode = "average"
unsharp_radius = 0.5
unsharp_amount = 5
min_sigma = 0.8
max_sigma = 2
threshold = 0.05
eliminate_overlap = 1
merge_overlap = 0.33
anatomy_threshold = "none"
anatomy_thresh_mult = 0
erode_iterations = 0
radius_multiplier = 1.5
min_radius = 1

[segmentation.watershed]
input_mode = "combined"
threshold = 0.05
min_distance = 1
gap_pixels = 2
min_size_to_shrink = 10
min_roi_size = 3

[segmentation.flood_fill]
input_mode = "average"
threshold = 0.075
min_distance = 1
max_size = 20
drop_fraction = 0.1
min_gap = 1
min_roi_size = 5

[deconvolution]
rise_tau_ms = 2.5       # Indicator rise tau (ms). Default: jGCaMP8f
decay_tau_ms = 75.0     # Indicator decay tau (ms). Default: jGCaMP8f
lambd = 0.003           # Wiener regularization (larger = smoother)
kernel_window_ms = 800.0      # Kernel support duration (ms)

[strf.general]
num_colours = 1

[strf.contouring]
global_thresh_val = 1.5
min_targets = 5
min_hole_size = 3
min_object_size = 3
surround_disksize = 20
gauss_sigma = 1.0

[strf.spatial]
snr_threshold = 3.0
kernel_width = 3
kernel_depth = 5
pix_subsample = 1
time_subsample = 2

[strf.temporal]
exclude_firstlast = [1, 1]
extrema_threshold = 3.0

[strf.calculate]
sta_past_window = 2.0
sta_future_window = 2.0
edge_crop = 2
event_sd_threshold = 2.0
use_znorm = true

[strf.centsurr]
n_clusters = 3
amplitude_ratio_threshold = 3.0
indices_around_peak = 2
abs_criteria = 3
